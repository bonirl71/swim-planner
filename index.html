<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sea Swim Planner</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #e8f5ff;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

h1 {
    color: #006994;
}

.card {
    background: #f4fbff;
    padding: 15px;
    margin-top: 15px;
    border-radius: 10px;
}

button {
    background: #0077b6;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 16px;
}

button:hover {
    background: #005f8a;
}
</style>

</head>

<body>

<div class="container">

<h1>🌊 Sea Swim Planner</h1>

<p>
Plan safe and enjoyable open water swims.
</p>

<div class="card">
<h2>Choose Swim Location</h2>

<select id="locationSelect">
</select>

</div>

<div class="card">
<h2>Current Conditions</h2>
<p id="conditions">
Checking conditions...
</p>
</div>

<div class="card">
<h2>Swim Recommendation</h2>
<p id="recommendation">
Waiting for data...
</p>
</div>

<button onclick="checkConditions()">
Check Swim Conditions
</button>

</div>
<script src="locations.js"></script>

<script>
function getWindDirection(degrees) {

const directions = [
"North",
"North-East",
"East",
"South-East",
"South",
"South-West",
"West",
"North-West"
];

return directions[Math.round(degrees / 45) % 8];

}
function loadLocations() {

const select = document.getElementById("locationSelect");

swimLocations.forEach(location => {

const option = document.createElement("option");

option.value = location.id;
option.textContent = location.name + " (" + location.county + ")";

select.appendChild(option);

});

}
async function checkConditions() {

document.getElementById("conditions").innerHTML =
"⏳ Getting live sea conditions...";

const selectedId = document.getElementById("locationSelect").value;

const selectedLocation = swimLocations.find(
location => location.id == selectedId
);

const latitude = selectedLocation.latitude;
const longitude = selectedLocation.longitude;

const url =
`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,wind_speed_10m,wind_direction_10m,weather_code&wind_speed_unit=ms`;

try {

const response = await fetch(url);
const data = await response.json();

const current = data.current;

document.getElementById("conditions").innerHTML =
`
🌡 Air temperature: ${current.temperature_2m}°C<br>
💨 Wind speed: ${data.current.wind_speed_10m} m/s<br>
🧭 Wind direction: ${getWindDirection(data.current.wind_direction_10m)}
☁ Weather code: ${current.weather_code}
`;

document.getElementById("recommendation").innerHTML =
"🟢 Initial weather check complete - suitable for further sea analysis";

}

catch(error) {

document.getElementById("conditions").innerHTML =
"⚠️ Unable to load weather data";

}

}
loadLocations();
</script>
</body>
</html>
