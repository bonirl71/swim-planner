<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sea Swim Planner</title>

<style>
body {
    margin: 0;
    padding: 20px;
    font-family: Arial, Helvetica, sans-serif;

    background: linear-gradient(
        180deg,
        #9fd6ff 0%,
        #dff4ff 40%,
        #f4fbff 100%
    );

    display: flex;
    justify-content: center;
}

.app {
    width: 100%;
    max-width: 520px;

    background: white;

    border-radius: 22px;

    padding: 24px;

    box-shadow:
        0 12px 30px rgba(0,0,0,0.15);

    margin-bottom: 40px;
}
.app-header{

display:flex;

align-items:center;

gap:18px;

margin-bottom:28px;

padding-bottom:20px;

border-bottom:1px solid #e7eef5;

}

.logo{

width:64px;

height:64px;

border-radius:18px;

display:flex;

align-items:center;

justify-content:center;

font-size:34px;

background:linear-gradient(135deg,#00b4ff,#0077cc);

color:white;

box-shadow:0 8px 18px rgba(0,119,204,.25);

}

.app-header h1{

margin:0;

font-size:34px;

color:#0d5f92;

}

.app-header p{

margin-top:6px;

margin-bottom:0;

color:#6b7b88;

font-size:16px;

}
.container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

h1 {
    color: #006994;
}

.card {
    background: #f4fbff;
    padding: 15px;
    margin-top: 15px;
    border-radius: 10px;
}

button {
    background: #0077b6;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 16px;
}

button:hover {
    background: #005f8a;
}
</style>

</head>

<body>

<div class="app">

<header class="app-header">

    <div class="logo">
        🌊
    </div>

    <div>

        <h1>Open Water Swim Planner</h1>

        <p>
            Plan safer sea and lake swims
        </p>

    </div>

</header>

<p>
Plan safe and enjoyable open water swims.
</p>

<div class="card">
<h2>Choose Swim Location</h2>

<select id="locationSelect">
</select>

</div>

<div class="card">
<h2>Current Conditions</h2>
<p id="conditions">
Checking conditions...
</p>
</div>

<div class="card">
<h2>Swim Recommendation</h2>
<p id="recommendation">
Waiting for data...
</p>
</div>

<button onclick="checkConditions()">
Check Swim Conditions
</button>

</div>
<script src="locations.js?v=2"></script>

<script>
function getWeatherDescription(code) {

if (code === 0) return "Clear sky ☀️";

if ([1,2,3].includes(code)) return "Cloudy ☁️";

if ([45,48].includes(code)) return "Fog 🌫️";

if (code >= 51 && code <= 67) return "Rain 🌧️";

if (code >= 71 && code <= 77) return "Snow ❄️";

if (code >= 80 && code <= 82) return "Rain showers 🌦️";

if (code >= 95) return "Thunderstorm ⛈️";

return "Unknown";

}


function getWindDirection(degrees) {

const directions = [
"North",
"North-East",
"East",
"South-East",
"South",
"South-West",
"West",
"North-West"
];
return directions[Math.round(degrees / 45) % 8];

}
function getCompassDirection(degrees) {

const directions = [
"N", "NNE", "NE", "ENE",
"E", "ESE", "SE", "SSE",
"S", "SSW", "SW", "WSW",
"W", "WNW", "NW", "NNW"
];

return directions[Math.round(degrees / 22.5) % 16];

}
function calculateSwimScore(waveHeight, wavePeriod, windSpeed, windDirection) {
let score = 100;

// Wave height penalty
if (waveHeight > 1.5) {
    score -= 40;
}
else if (waveHeight > 1.0) {
    score -= 25;
}
else if (waveHeight > 0.5) {
    score -= 10;
}

// Wave period penalty
if (wavePeriod < 4) {
    score -= 20;
}
else if (wavePeriod < 6) {
    score -= 10;
}

// Wind speed penalty
if (windSpeed > 8) {
    score -= 35;
}
else if (windSpeed > 5) {
    score -= 15;
}
else if (windSpeed > 3) {
    score -= 5;
}

// Wind direction penalty
if (windDirection.includes("North")) {
    score -= 15;
}

if (windDirection === "West") {
    score += 5;
}

return Math.max(score,0);
}    
function loadLocations() {

const select = document.getElementById("locationSelect");

swimLocations.forEach(location => {

const option = document.createElement("option");

option.value = location.id;
option.textContent = location.name + " (" + location.county + ")";

select.appendChild(option);

});

}
async function checkConditions() {
console.log("checkConditions started");

document.getElementById("conditions").innerHTML =
"⏳ Getting live sea conditions...";

const selectedId = document.getElementById("locationSelect").value;

const selectedLocation = swimLocations.find(
    location => location.id == selectedId
);

const latitude = selectedLocation.latitude;
const longitude = selectedLocation.longitude;

const url =
`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,wind_speed_10m,wind_direction_10m,weather_code&wind_speed_unit=ms`;

const marineUrl =
`https://marine-api.open-meteo.com/v1/marine?latitude=${latitude}&longitude=${longitude}&current=wave_height,wave_period,wave_direction,sea_surface_temperature`;

const today = new Date();
const tomorrow = new Date(today);
tomorrow.setDate(today.getDate() + 1);

const todayString = today.toISOString().split("T")[0];
const tomorrowString = tomorrow.toISOString().split("T")[0];

const tideUrl =
`https://erddap.marine.ie/erddap/tabledap/imiTidePredictionEpa.json?&stationID%3D%22${selectedLocation.tideStation}%22&time%3E=${todayString}T00%3A00%3A00Z&time%3C=${tomorrowString}T00%3A00%3A00Z`;
try {

const response = await fetch(url);
const data = await response.json();

let marineData = null;
let tideData = null;

if (selectedLocation.type !== "lake") {

    const marineResponse = await fetch(marineUrl);
    marineData = await marineResponse.json();

    const tideResponse = await fetch(tideUrl);
    tideData = await tideResponse.json();

}
console.log("🌊 TIDE STATION USED:", selectedLocation.tideStation);
    
console.log(tideData);
console.log(marineData);

const current = data.current;
/* =========================
   LAKE CONDITIONS
   ========================= */

if (selectedLocation.type === "lake") {

    const windSpeed = current.wind_speed_10m;
    const windDegrees = current.wind_direction_10m;
    const windDirection = getWindDirection(windDegrees);

    let lakeCondition;
    let locationImpact;
    let swimAdvice;

    /* =========================
   LAKE WIND DIRECTION
   ========================= */

if (windDegrees >= 157.5 && windDegrees < 202.5) {

    // SOUTH
    lakeCondition = "🟢 CALM TO SLIGHT CHOP";

    locationImpact =
        "🟢 Youghal side: Calm<br>" +
        "🟡 Tomona side: A little choppier";

    swimAdvice =
        "Youghal side is the better option in a southerly wind.";

}
else if (windDegrees >= 337.5 || windDegrees < 22.5) {

    // NORTH
    lakeCondition = "🟢 CALM TO SLIGHT CHOP";

    locationImpact =
        "🟡 Youghal side: A little choppier<br>" +
        "🟢 Tomona side: Calm";

    swimAdvice =
        "Tomona side is the better option in a northerly wind.";

}
else if (windDegrees >= 202.5 && windDegrees < 247.5) {

    // SOUTH-WEST
    lakeCondition = "🟠 INCREASING CHOP";

    locationImpact =
        "🟠 Both sides becoming more exposed";

    swimAdvice =
        "South-westerly wind creates increasing chop. Conditions are less sheltered than with a true southerly wind.";

}
else if (windDegrees >= 247.5 && windDegrees < 292.5) {

    // WEST
    lakeCondition = "🔴 CHOPPY";

    locationImpact =
        "🔴 Both sides exposed to chop";

    swimAdvice =
        "Westerly wind creates chop across the lake. Swimming towards Caddy's means swimming into the wind.";

}
else if (windDegrees >= 292.5 && windDegrees < 337.5) {

    // NORTH-WEST
    lakeCondition = "🟠 INCREASING CHOP";

    locationImpact =
        "🟠 Both sides becoming more exposed";

    swimAdvice =
        "North-westerly wind creates increasing chop, particularly on exposed sections.";

}
else if (windDegrees >= 67.5 && windDegrees < 112.5) {

    // EAST
    lakeCondition = "🟡 SLIGHTLY CHOPPY";

    locationImpact =
        "🟡 Both sides somewhat sheltered";

    swimAdvice =
        "Easterly wind is generally more sheltered than westerly, but some chop is expected.";

}
else if (windDegrees >= 22.5 && windDegrees < 67.5) {

    // NORTH-EAST
    lakeCondition = "🟡 SLIGHTLY CHOPPY";

    locationImpact =
        "🟡 Generally sheltered with some chop";

    swimAdvice =
        "North-easterly wind should produce relatively modest chop.";

}
else if (windDegrees >= 112.5 && windDegrees < 157.5) {

    // SOUTH-EAST
    lakeCondition = "🟢 CALM TO SLIGHT CHOP";

    locationImpact =
        "🟢 Youghal side: Generally sheltered<br>" +
        "🟡 Tomona side: Some exposure";

    swimAdvice =
        "South-easterly wind should leave the Youghal side relatively sheltered.";

}
else {

    lakeCondition = "🟡 VARIABLE";

    locationImpact =
        "ℹ️ Conditions depend on the exact wind direction";

    swimAdvice =
        "Check the wind direction before swimming.";

}


    /* Wind strength adjustment */

    if (windSpeed > 7) {

        lakeCondition = "🔴 CHOPPY / STRONG WIND";

        swimAdvice +=
            "<br>⚠️ Strong wind — conditions may be significantly rougher than normal.";

    }
    else if (windSpeed > 5) {

        swimAdvice +=
            "<br>🟡 Moderate wind — expect increased chop.";

    }


    document.getElementById("conditions").innerHTML =
    `
    🌡 Air temperature: ${current.temperature_2m}°C<br>
    💨 Wind speed: ${windSpeed} m/s<br>
    🧭 Wind direction: ${windDirection} (${windDegrees.toFixed(0)}°)<br>
    ☁ Conditions: ${getWeatherDescription(current.weather_code)}<br><br>

    <hr>

    <h3>🏊 LAKE CONDITIONS</h3>

    <strong>${lakeCondition}</strong><br><br>

    ${locationImpact}<br><br>

    ${swimAdvice}
    `;


    document.getElementById("recommendation").innerHTML =
    `
    🏊 <strong>LAKE SWIM RECOMMENDATION</strong><br><br>

    ${lakeCondition}<br><br>

    ${swimAdvice}
    `;

    return;
}
console.log("TIDE ROWS:", tideData.table.rows);
console.log("TIDE COLUMNS:", tideData.table.columnNames);


/* =========================
   FIND HIGH & LOW TIDES
   ========================= */

const tideRows = tideData.table.rows;

let tideEvents = [];

for (let i = 1; i < tideRows.length - 1; i++) {

    const previousHeight = Number(tideRows[i - 1][4]);
    const currentHeight = Number(tideRows[i][4]);
    const nextHeight = Number(tideRows[i + 1][4]);

    // HIGH TIDE
    if (
        currentHeight > previousHeight &&
        currentHeight >= nextHeight
    ) {
        tideEvents.push({
            type: "High Tide",
            time: new Date(tideRows[i][0]),
            height: currentHeight
        });
    }

    // LOW TIDE
    if (
        currentHeight < previousHeight &&
        currentHeight <= nextHeight
    ) {
        tideEvents.push({
            type: "Low Tide",
            time: new Date(tideRows[i][0]),
            height: currentHeight
        });
    }
}


/* Remove any duplicate events that are too close together */

const filteredTides = [];

for (const tide of tideEvents) {

    if (filteredTides.length === 0) {
        filteredTides.push(tide);
        continue;
    }

    const previous =
        filteredTides[filteredTides.length - 1];

    const difference =
        (tide.time - previous.time) / (1000 * 60);

    // Real high/low tides are several hours apart.
    // Ignore small fluctuations in the model.
    if (difference >= 120) {
        filteredTides.push(tide);
    }
}


/* =========================
   FORMAT TIDE DISPLAY
   ========================= */

const tideDisplay = filteredTides
    .slice(0, 6)
    .map(tide => {

        const time = tide.time.toLocaleTimeString(
            "en-IE",
            {
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
            }
        );

        const icon =
            tide.type === "High Tide" ? "🔵" : "⚪";

        return `
        <div style="margin:6px 0;">
            ${icon} <strong>${tide.type}</strong>
            — ${time}
            — ${tide.height.toFixed(2)} m
        </div>
        `;
    })
    .join("");


/* =========================
   DISPLAY SEA CONDITIONS
   ========================= */

document.getElementById("conditions").innerHTML =
`
🌡 Air temperature: ${current.temperature_2m}°C<br>
🌊 Water temperature: ${marineData.current.sea_surface_temperature}°C<br>
💨 Wind speed: ${current.wind_speed_10m} m/s<br>
🧭 Wind direction: ${getWindDirection(current.wind_direction_10m)}<br>
☁ Conditions: ${getWeatherDescription(current.weather_code)}<br><br>

🌊 Wave height: ${marineData.current.wave_height} m<br>
⏱ Wave period: ${marineData.current.wave_period} s<br>
🌊 Swell direction: ${getCompassDirection(marineData.current.wave_direction)}
(${marineData.current.wave_direction.toFixed(0)}°)<br><br>

<hr>

<h3>🌊 TIDES</h3>

${tideDisplay}

`;


/* =========================
   SWIM SCORE
   ========================= */

let reasons = [];

const swimScore = calculateSwimScore(
    marineData.current.wave_height,
    marineData.current.wave_period,
    current.wind_speed_10m,
    getWindDirection(current.wind_direction_10m)
);

const windDirection =
    getWindDirection(current.wind_direction_10m);

if (windDirection === "West") {
    reasons.push("✅ Westerly wind - ideal direction");
}
else if (windDirection.includes("North")) {
    reasons.push("⚠️ Northerly wind - less favourable");
}
else {
    reasons.push("ℹ️ Wind direction: " + windDirection);
}

if (current.wind_speed_10m <= 3) {
    reasons.push(
        "✅ Light wind (" +
        current.wind_speed_10m +
        " m/s)"
    );
}
else if (current.wind_speed_10m <= 5) {
    reasons.push(
        "🟡 Moderate wind (" +
        current.wind_speed_10m +
        " m/s)"
    );
}
else {
    reasons.push(
        "🔴 Strong wind (" +
        current.wind_speed_10m +
        " m/s)"
    );
}

if (marineData.current.wave_height <= 0.5) {
    reasons.push(
        "✅ Small waves (" +
        marineData.current.wave_height +
        " m)"
    );
}
else if (marineData.current.wave_height <= 1) {
    reasons.push(
        "🟡 Moderate waves (" +
        marineData.current.wave_height +
        " m)"
    );
}
else {
    reasons.push(
        "🔴 Large waves (" +
        marineData.current.wave_height +
        " m)"
    );
}

if (marineData.current.sea_surface_temperature >= 15) {
    reasons.push(
        "✅ Comfortable water temperature (" +
        marineData.current.sea_surface_temperature +
        "°C)"
    );
}
else if (marineData.current.sea_surface_temperature >= 12) {
    reasons.push(
        "🟡 Cold water (" +
        marineData.current.sea_surface_temperature +
        "°C)"
    );
}
else {
    reasons.push(
        "🔴 Very cold water (" +
        marineData.current.sea_surface_temperature +
        "°C)"
    );
}


/* =========================
   RATING
   ========================= */

let rating;

if (swimScore >= 80) {
    rating = "🟢 EXCELLENT CONDITIONS";
}
else if (swimScore >= 60) {
    rating = "🟡 GOOD CONDITIONS";
}
else if (swimScore >= 40) {
    rating = "🟠 CHALLENGING CONDITIONS";
}
else {
    rating = "🔴 POOR CONDITIONS";
}

let assessment;

if (swimScore >= 85) {
    assessment = "🟢 Excellent swimming conditions";
}
else if (swimScore >= 70) {
    assessment = "🟢 Good swimming conditions";
}
else if (swimScore >= 50) {
    assessment = "🟡 Challenging conditions";
}
else {
    assessment = "🔴 Poor conditions";
}


/* =========================
   RECOMMENDATION
   ========================= */

document.getElementById("recommendation").innerHTML =
`

🏊 Swim Score: ${swimScore}/100<br>
${rating}<br><br>

${reasons.join("<br>")}
`;

}

catch(error) {

console.error("ERROR:", error);

document.getElementById("conditions").innerHTML =
"⚠️ Unable to load weather data";

}

}
loadLocations();
</script>
</div>
</body>
</html>
