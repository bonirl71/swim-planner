<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sea Swim Planner</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #e8f5ff;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

h1 {
    color: #006994;
}

.card {
    background: #f4fbff;
    padding: 15px;
    margin-top: 15px;
    border-radius: 10px;
}

button {
    background: #0077b6;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 16px;
}

button:hover {
    background: #005f8a;
}
</style>

</head>

<body>

<div class="container">

<h1>🌊 Sea Swim Planner</h1>

<p>
Plan safe and enjoyable open water swims.
</p>

<div class="card">
<h2>Swim Location</h2>
<p>Blackhead Lighthouse → Gleninagh Pier</p>
</div>

<div class="card">
<h2>Current Conditions</h2>
<p id="conditions">
Checking conditions...
</p>
</div>

<div class="card">
<h2>Swim Recommendation</h2>
<p id="recommendation">
Waiting for data...
</p>
</div>

<button onclick="checkConditions()">
Check Swim Conditions
</button>

</div>

<script>

function checkConditions() {

document.getElementById("conditions").innerHTML =
"🌡 Water temperature: Loading<br>🌊 Swell: Loading<br>💨 Wind: Loading";

document.getElementById("recommendation").innerHTML =
"✅ Initial assessment: Good potential swim window (demo mode)";

}

</script>

</body>
</html>
